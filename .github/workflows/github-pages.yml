# GitHub Pages — peaceiris/actions-gh-pages (работает без настройки Pages)
# После первого деплоя: Settings → Pages → Source: Deploy from a branch → Branch: gh-pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -f index.html batch.html 404.html styles.css _site/
          touch _site/.nojekyll
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          allow_empty_commit: true
